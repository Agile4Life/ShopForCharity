  "components": {
    "schemas": {
      "ProductInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 100
          },
          "slug": {
            "type": "string",
            "maxLength": 120
          },
          "categoryId": {
            "type": "string",
            "format": "uuid"
          },
          "description": {
            "type": "string",
            "maxLength": 5000
          },
          "price": {
            "type": "integer",
            "minimum": 1,
            "maximum": 99999999999999
          },
          "imageAssetId": {
            "type": "string",
            "format": "uuid"
          },
          "ingredients": {
            "type": "string",
            "maxLength": 2000
          },
          "allergens": {
            "type": "string",
            "maxLength": 2000
          },
          "storageInstructions": {
            "type": "string",
            "maxLength": 2000
          },
          "initialStock": {
            "type": "integer",
            "format": "int32",
            "minimum": 0
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64"
          },
          "stockOnHand": {
            "type": "integer",
            "format": "int32",
            "minimum": 0
          },
          "preservationInstructions": {
            "type": "string",
            "maxLength": 2000
          }
        },
        "required": [
          "expectedVersion"
        ]
      },
      "Component": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "productId": {
            "type": "string",
            "format": "uuid"
          },
          "quantity": {
            "type": "integer",
            "format": "int32",
            "minimum": 1,
            "maximum": 1000
          }
        },
        "required": [
          "productId",
          "quantity"
        ]
      },
      "ComboInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 100
          },
          "slug": {
            "type": "string",
            "maxLength": 120
          },
          "description": {
            "type": "string",
            "maxLength": 5000
          },
          "price": {
            "type": "integer",
            "minimum": 1,
            "maximum": 99999999999999
          },
          "imageAssetId": {
            "type": "string",
            "format": "uuid"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Component"
            },
            "minItems": 2,
            "maxItems": 30
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "expectedVersion"
        ]
      },
      "VersionInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "expectedVersion"
        ]
      },
      "StockInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "stockOnHand": {
            "type": "integer",
            "format": "int32",
            "minimum": 0
          },
          "deltaOnHand": {
            "type": "integer",
            "format": "int32"
          },
          "reason": {
            "type": "string",
            "maxLength": 500
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "reason",
          "expectedVersion"
        ],
        "description": "Supply exactly one of absolute stockOnHand or deltaOnHand; expectedVersion is inventoryVersion."
      },
      "ProfilePatch": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "fullName": {
            "type": "string"
          },
          "phone": {
            "type": "string"
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "expectedVersion"
        ]
      },
      "CartLine": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "PRODUCT",
              "COMBO"
            ]
          },
          "catalogId": {
            "type": "string",
            "format": "uuid"
          },
          "quantity": {
            "type": "integer",
            "format": "int32",
            "minimum": 1,
            "maximum": 20
          }
        },
        "required": [
          "kind",
          "catalogId",
          "quantity"
        ]
      },
      "QuoteInput": {
